# ============================================================
# pytest 配置文件
# ============================================================
# 这个文件会被 pytest 自动识别，不需要手动指定
# 面试可以说：通过 pytest.ini 统一管理测试运行参数和标记

[pytest]

# 测试文件查找路径（pytest 会自动在这个目录下找 test_*.py）
testpaths = tests

# 测试发现规则（默认就是这些，写出来是为了明确）
python_files = test_*.py          # 只运行 test_ 开头的文件
python_classes = Test*             # 只运行 Test 开头的类
python_functions = test_*          # 只运行 test_ 开头的函数

# 默认命令行参数（每次跑 pytest 自动带上这些）
# -v: 详细输出，显示每个用例名和结果
# --tb=short: 报错时只显示关键的调用栈，不刷屏
addopts = -v --tb=short

# ============================================================
# 日志配置（测试侧的日志，不依赖后端代码）
# ============================================================
# log_cli: 日志直接输出到控制台（跑 pytest 时能看到）
# log_cli_level: 控制台显示 INFO 及以上级别
# log_cli_format: 日志格式 — 时间 + 级别 + 模块 + 消息
# log_file: 同时写一份到文件（测试报告的补充）
# log_file_level: 文件里记录 DEBUG 及以上（比控制台更详细）

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %m-%d %H:%M:%S

# 关掉 selenium 和 urllib3 的 DEBUG 日志（太吵了）
log_level = DEBUG
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_file = reports/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(filename)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 注册自定义标记（在用例上加 @pytest.mark.smoke 来分类）
markers =
    smoke: 冒烟测试 — 核心功能快速验证（主流程能不能走通）
    regression: 回归测试 — 全量用例（改了代码后跑一遍确保没改坏）
    open_browser: 打开浏览器测试
    fill_form: 表单填写测试

