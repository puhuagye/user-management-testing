# ============================================================
# 项目统一配置文件
# ============================================================
# 这是整个项目唯一的配置来源。
# app/config.py 和 tests/common/config.py 都读这个文件。
# 切换环境（开发/测试/生产）只需要改这一个文件。
#
# 优先级：环境变量 > config.yaml 里的值
# 比如设置了 DB_PASSWORD=9999，就会用 9999 而不是 yaml 里的 1111
# ============================================================

# ── 数据库连接 ──
database:
  host: 127.0.0.1      # MySQL 地址（本机）
  port: 3307            # 端口号（安装 MySQL 时选的 3307）
  user: root            # 用户名
  password: "1111"      # 密码（带引号是因为纯数字，YAML 有时会误解析）
  database: user_management  # 数据库名
  charset: utf8mb4      # 字符编码（支持中文和 emoji）

# ── Flask 应用 ──
app:
  host: 0.0.0.0         # 监听地址（0.0.0.0 = 所有网卡，局域网也能访问）
  port: 5000             # 端口号
  debug: true            # 调试模式（开发开，上线关）
  secret_key: dev-secret-key-2024  # Session 加密密钥（生产环境要换成复杂随机串）

# ── 测试配置 ──
test:
  base_url: http://127.0.0.1:5000  # 被测系统地址
