<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增用户</title>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      body {
          font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
          background: #f0f2f5;
          padding: 20px;
      }
      .container {
          max-width: 500px;
          margin: 0 auto;
          background: #fff;
          padding: 30px;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h1 {
          color: #333;
          margin-bottom: 20px;
          border-bottom: 2px solid #1890ff;
          padding-bottom: 10px;
      }

      /* ===== 表单样式 ===== */
      .form-group {
          margin-bottom: 16px;
      }
      .form-group label {
          display: block;
          /*  ↑ block = 独占一行，让输入框另起一行 */
          margin-bottom: 6px;
          color: #555;
          font-weight: 600;
      }
      .form-group label .required {
          color: #ff4d4f;
          /*  ↑ 红色星号标记必填字段 */
      }
      .form-group input {
          width: 100%;
          /*  ↑ 输入框占满整行 */
          padding: 8px 12px;
          border: 1px solid #d9d9d9;
          border-radius: 4px;
          font-size: 14px;
      }
      .form-group input:focus {
          border-color: #1890ff;
          outline: none;
          /*  ↑ focus = 输入框被点击时，边框变蓝 */
          box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
      }
      .form-group .hint {
          font-size: 12px;
          color: #999;
          margin-top: 4px;
      }

      /* ===== 按钮组 ===== */
      .btn-group {
          margin-top: 20px;
      }
      .btn {
          padding: 8px 20px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 14px;
          color: #fff;
      }
      .btn-submit {
          background: #1890ff;
      }
      .btn-submit:hover {
          background: #40a9ff;
      }
      .btn-cancel {
          background: #999;
          margin-left: 10px;
      }
      .btn-cancel:hover {
          background: #bbb;
      }

      /* ===== 消息提示 ===== */
      .message {
          padding: 10px;
          margin-bottom: 15px;
          border-radius: 4px;
          display: none;
      }
      .message.error {
          background: #fff2f0;
          border: 1px solid #ffccc7;
          color: #cf1322;
      }
  </style>
</head>
<body>
  <div class="container">
      <h1>➕  新增用户</h1>

      <!-- 错误消息提示 -->
      <div id="message" class="message"></div>

      <!-- 表单：每个 .form-group 是一个输入行 -->
      <form id="createForm">
          <!-- 姓名（必填） -->
          <div class="form-group">
              <label><span class="required">*</span> 姓名</label>
              <input type="text" id="name" placeholder="请输入姓名" required>
              <!--  ↑ id="name" → Selenium 可以通过 id 定位这个输入框 -->
              <!--  ↑ placeholder = 输入框里的灰色提示文字 -->
              <!--  ↑ required = HTML5 必填校验（浏览器层） -->
              <div class="hint">必填，1-50 个字符</div>
          </div>

          <!-- 邮箱（必填） -->
          <div class="form-group">
              <label><span class="required">*</span> 邮箱</label>
              <input type="email" id="email" placeholder="请输入邮箱" required>
              <!--  ↑ type="email" → 浏览器自动校验邮箱格式 -->
          </div>

          <!-- 手机号（选填） -->
          <div class="form-group">
              <label>手机号</label>
              <input type="text" id="phone" placeholder="请输入手机号（选填）">
              <div class="hint">选填，1-20 个字符</div>
          </div>

          <!-- 按钮 -->
          <div class="btn-group">
              <button type="submit" class="btn btn-submit">提交</button>
              <!--  ↑ type="submit" → 点击时触发表单的 submit 事件 -->
              <a href="/users" class="btn btn-cancel" style="text-decoration:none;">
                  返回列表
              </a>
          </div>
      </form>
  </div>

  <script>
      // 获取表单元素
      var form = document.getElementById('createForm');

      // 监听表单的 submit 事件（用户点"提交"按钮时触发）
      form.addEventListener('submit', function(event) {
          // 第1步：阻止浏览器默认行为（默认会刷新页面）
          event.preventDefault();
          //  ↑ preventDefault = 阻止默认行为
          //  如果不阻止，浏览器会把表单数据拼到 URL 上然后刷新页面
          //  我们要用 JS 发 AJAX 请求，不能刷新

          // 第2步：清空之前的错误消息
          var msg = document.getElementById('message');
          msg.style.display = 'none';

          // 第3步：收集表单数据
          var name = document.getElementById('name').value.trim();
          var email = document.getElementById('email').value.trim();
          var phone = document.getElementById('phone').value.trim() || null;
          //  ↑ .value = 取输入框里的文字
          //  ↑ .trim() = 去掉首尾空格
          //  ↑ || null = 空字符串转成 null（对应数据库的 NULL）

          // 第4步：前端校验（在发请求之前先检查，减少无效请求）
          if (!name) {
              showMessage('请输入姓名！', 'error');
              return;
          }
          if (!email) {
              showMessage('请输入邮箱！', 'error');
              return;
          }

          // 第5步：构建请求体
          var payload = {
              name: name,
              email: email,
              phone: phone
          };

          // 第6步：发 POST 请求创建用户
          fetch('/api/users', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json'
                  //  ↑ 告诉服务器：我发的是 JSON 格式的数据
              },
              body: JSON.stringify(payload)
              //  ↑ JSON.stringify() = 把 JavaScript 对象转成 JSON 字符串
              //  {name:"张三"} → '{"name":"张三"}'
          })
          .then(function(response) {
              return response.json();
          })
          .then(function(result) {
              if (result.code === 201) {
                  // 创建成功 → 跳转回用户列表页
                  alert('创建成功！用户 ID: ' + result.data.id);
                  window.location.href = '/users';
                  //  ↑ window.location.href = 浏览器跳转到指定地址
              } else {
                  // 创建失败 → 显示错误消息
                  showMessage(result.message, 'error');
              }
          })
          .catch(function(error) {
              showMessage('请求失败：' + error.message, 'error');
          });
      });

      // 显示错误消息
      function showMessage(text, type) {
          var msg = document.getElementById('message');
          msg.textContent = text;
          msg.className = 'message ' + type;
          msg.style.display = 'block';
      }
  </script>
</body>
</html>
